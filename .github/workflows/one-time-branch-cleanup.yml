name: One-time obsolete branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged or superseded branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            develop \
            feature/library-runtime \
            feature/project-context \
            feature/provider-adapters \
            fix/library-boundary; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
