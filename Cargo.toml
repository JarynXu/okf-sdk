[package]
name = "okf"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Vendor-neutral SDK and Library runtime for Open Knowledge Format"
license = "Apache-2.0"
repository = "https://github.com/open-knowledge-stack/okf-sdk"
readme = "README.md"
keywords = ["knowledge", "markdown", "retrieval", "graph", "library"]
categories = ["data-structures", "parser-implementations"]

[features]
default = []
http-provider = ["dep:reqwest"]
sqlite-provider = ["dep:rusqlite"]
s3-provider = ["dep:rust-s3"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"
yaml_serde = "0.10"
wait-timeout = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
rusqlite = { version = "0.37", optional = true }
rust-s3 = { version = "0.37.2", default-features = false, features = ["sync-rustls-tls", "fail-on-err"], optional = true }

[dev-dependencies]
tempfile = "3.20"
